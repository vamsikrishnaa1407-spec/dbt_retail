# profiles.yml — fill in your Snowflake credentials before running
# Place this file at ~/.dbt/profiles.yml or pass --profiles-dir seeds/dbt_retail_project

retail_analytics:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOW_ACCOUNT') }}"          # e.g. xy12345.eu-west-1
      user: "{{ env_var('SNOW_USER') }}"
      password: "{{ env_var('SNOW_PASS') }}"
      role: SYSADMIN
      warehouse: RETAIL_WH
      database: STAGING_DB                              # dbt writes here by default
      schema: retail
      threads: 4
      client_session_keep_alive: false
